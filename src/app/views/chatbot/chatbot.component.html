<div class="chat-widget" [class.open]="isOpen">

  <!-- BOTÓN FLOTANTE -->
  <button class="chat-toggle" (click)="toggleChat()" [attr.aria-label]="isOpen ? 'Cerrar chat' : 'Abrir chat de asistencia'">
    @if (!isOpen) {
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="online-indicator"></span>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    }
  </button>

  <!-- CAJA DEL CHAT -->
  <div class="chat-box" role="dialog" aria-label="Asistente virtual de NuTaTaMo">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-user">
        <div class="avatar-ring">
          <span class="avatar-emoji">💅</span>
          <span class="status-dot"></span>
        </div>
        <div class="avatar-details">
          <h4>NuTaTaMo Concierge</h4>
          <span class="status-text">Asistente Virtual • En línea</span>
        </div>
      </div>
      <button class="header-close-btn" (click)="toggleChat()" aria-label="Cerrar chat">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <!-- Quick Replies -->
    <div class="quick-chips">
      @for (chip of quickReplies; track chip) {
        <button type="button" class="chip-btn" (click)="sendQuick(chip)">{{ chip }}</button>
      }
    </div>

    <!-- Mensajes -->
    <div class="messages" #messagesContainer>
      @for (m of messages; track $index) {
        <div class="message-wrapper" [class.user]="m.sender === 'user'" [class.bot]="m.sender === 'bot'">
          @if (m.sender === 'bot') {
            <span class="bot-bubble-icon">✨</span>
          }
          <div class="message-bubble">
            <p>{{ m.message }}</p>
            <span class="message-time">{{ m.time }}</span>
          </div>
        </div>
      }

      @if (isTyping) {
        <div class="message-wrapper bot">
          <span class="bot-bubble-icon">✨</span>
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      }
    </div>

    <!-- Input Box -->
    <div class="input-box">
      <input 
        type="text" 
        [value]="inputText" 
        (input)="onInputChange($event)"
        (keydown)="handleKeyDown($event)"
        placeholder="Escribe tu consulta..."
        aria-label="Escribe tu mensaje">
      <button type="button" class="btn-send" (click)="send()" [disabled]="!inputText.trim()" aria-label="Enviar mensaje">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </button>
    </div>

  </div>
</div>
